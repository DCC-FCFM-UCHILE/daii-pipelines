# Decisiones a mano sobre fusiones del deduplicador (src/daii/silver/dedup.py). Ver "Deduplicación" en el README.
#
# Cada par lleva `decision`:
#   fusionar: un candidato (unión dudosa, explorador → Pipeline → Fusiones → Candidatos) es el mismo registro.
#             Se fusiona y queda en la tabla `fusion` con la regla `revisada`.
#   separar:  dos registros que una regla unió (o que son candidato) son distintos. No se unen en ninguna tabla ni
#             persona, y una tercera fila parecida a ambos tampoco los junta.
# No afecta las uniones por el mismo DOI o el mismo código de proyecto: son la misma entidad por definición.
#
# Cada registro se identifica por su texto principal: el título (publicación, proyecto, tesis, actividad), la
# organización (afiliación), el nombre (área, distinción), el grado (formación) o la URL (perfil). Se compara
# normalizado (sin tildes, mayúsculas ni puntuación), en todas las tablas y personas donde aparezca ese par. `motivo` es libre: quién lo revisó y por qué.
# Después de editar: `uv run daii silver && uv run daii gold`.
