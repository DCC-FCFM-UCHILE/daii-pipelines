# Nombres legibles de las categorías fijas de gold: `<tabla>.<columna>` → código → nombre.
# Los datos guardan el código; lo que se muestra sale de aquí (gold lo publica en la tabla `catalogo`).
# Editar un nombre aquí cambia lo que se ve en todas partes desde la próxima publicación (`daii silver && daii gold`).
# Un test exige que todo código que produce el pipeline tenga nombre. Los sitios personales (`sitio_<slug>`) no se
# listan: gold los nombra "Sitio personal de <nombre>" desde academicos.yaml.

