# Migraciones del esquema gold. Ver `make migration` y src/daii/gold/migrations/env.py.
[alembic]
# Debe coincidir con daii.gold.load.MIGRATIONS (gold la usa sin leer este archivo).
script_location = src/daii/gold/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src
