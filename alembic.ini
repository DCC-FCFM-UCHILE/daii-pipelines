# Migraciones: gold (sección [alembic], la por defecto) y data/logs.sqlite (`alembic -n logs`).
# Ver `make migration` y los env.py de cada script_location.
[alembic]
# Debe coincidir con daii.gold.load.MIGRATIONS (gold la usa sin leer este archivo).
script_location = src/daii/gold/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src

[logs]
# Debe coincidir con daii.log.MIGRATIONS.
script_location = src/daii/logs_migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src
