# Los hooks locales usan las versiones fijadas en uv.lock.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: uv run ty check src
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: conventional-commit
        name: Conventional Commit
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
