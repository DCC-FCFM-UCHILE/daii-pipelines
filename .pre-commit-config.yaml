default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Archivos, portabilidad y seguridad
      - id: check-added-large-files
        args: [--enforce-all, --maxkb=1024]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: detect-private-key

      # Sintaxis y convenciones
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]

      # Formato. Las fixtures preservan los archivos originales de las fuentes.
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/fixtures/
  # Los hooks locales usan las versiones fijadas en uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: uv run ty check src
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: conventional-commit
        name: Conventional Commit
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
