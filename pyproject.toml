[project]
name = "daii"
version = "0.4.0"
description = "Pipeline de datos del dashboard DAII (FCFM, U. de Chile): scrapers por fuente, medallion, Prefect"
authors = [
    { name = "Pablo Badilla", email = "pablo.badilla@uchile.cl" }
]
requires-python = ">=3.14.10,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "loguru>=0.8.0",
    "polars>=2.1.0",
    "prefect>=3.9.4",
    "pydantic>=2.14",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "scrapy>=2.20.0",
    "scrapy-playwright>=0.0.48",
    "sqlmodel>=0.0.50",
]

[project.scripts]
daii = "daii:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.20.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]
explorar = [
    "streamlit>=1.67.0",
]

[tool.uv]
# El explorador (Streamlit) viene en desarrollo; un despliegue solo del pipeline usa `uv sync --no-default-groups`.
default-groups = ["dev", "explorar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-select = ["A", "ASYNC210", "DTZ", "PERF", "PGH003", "PIE", "PTH", "RUF100"]

[tool.ty.rules]
# Scrapy declara `Spider.parse` como atributo (CallbackT); sobreescribirlo es el patrón idiomático.
incompatible-mutable-override = "ignore"

[tool.commitizen]
version_provider = "uv"
version_scheme = "semver"
tag_format = "v$version"
bump_message = "chore(release): $new_version"

# Solo el bump usa cz_customize. El hook y el CI usan el validador convencional.
[tool.commitizen.customize.bump_map]
'.+!$' = "MAJOR"
'^BREAKING[ -]CHANGE$' = "MAJOR"
'^feat(\(|$)' = "MINOR"
'^perf(\(|$)' = "MINOR"
'^fix(\(|$)' = "PATCH"
'^refactor(\(|$)' = "PATCH"
